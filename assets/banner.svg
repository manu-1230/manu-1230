<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/><stop offset="0.5" stop-color="#150734"/><stop offset="1" stop-color="#051937"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/><stop offset="0.5" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00f0ff" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="780" cy="70" r="46" fill="#ff2bd6" opacity="0.85"/>
  <g stroke="#0d0221" stroke-width="5"><line x1="730" y1="62" x2="830" y2="62"/><line x1="735" y1="76" x2="825" y2="76"/><line x1="745" y1="90" x2="815" y2="90"/></g>
  <polygon points="0,260 0,205 120,180 240,215 360,170 480,210 600,175 720,212 900,165 900,260" fill="#00f0ff" opacity="0.08"/>
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="90" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="35" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="50" y="125" font-family="'Courier New',monospace" font-size="64" font-weight="700" fill="url(#txt)" filter="url(#glow)">RexTheDev</text>
  <text x="52" y="168" font-family="'Courier New',monospace" font-size="22" fill="#9be7ff">&gt; #include &lt;coffee.h&gt;<tspan fill="#39ff14">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
  <text x="52" y="210" font-family="'Courier New',monospace" font-size="15" fill="#ff2bd6">[ AR · campus nav · questionable code · infinite coffee ]</text>
</svg>
